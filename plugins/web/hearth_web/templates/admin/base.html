{% extends "base.html" %} {% block body %}
<wa-page>
    <header slot="header" class="app-header">
        <a href="/admin" class="brand">
            {% if brand.logo_url %}<img
                src="{{ brand.logo_url }}"
                alt=""
                width="24"
                height="24"
            />{% else %}<img
                src="/static/img/hearth-mark.svg"
                alt=""
                width="24"
                height="24"
            />{% endif %}
            <strong>{{ brand.name }}</strong>
        </a>
        <div class="header-actions">
            <wa-button
                appearance="plain"
                size="small"
                onclick="toggleTheme()"
                aria-label="Toggle theme"
            >
                <wa-icon name="circle-half-stroke"></wa-icon>
            </wa-button>
            {% if current_actor is defined and current_actor.actor_kind !=
            'anonymous' %}
            <form method="post" action="/logout" class="signout-form">
                <wa-button type="submit" appearance="plain" size="small"
                    >Sign out</wa-button
                >
            </form>
            {% endif %}
        </div>
    </header>
    <div
        slot="navigation"
        style="
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--nav-bg);
        "
    >
        {% include "admin/_partials/nav.html" %}
    </div>
    <main>{% block page_content %}{% endblock %}</main>
</wa-page>
{% endblock %}
