{% extends "admin/base.html" %}
{% block title %}Schema — {{ brand.name }}{% endblock %}
{% block page_content %}
<style>
main {
    height: calc(100dvh - 56px);
    overflow: hidden;
}
.cy-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
}
.cy-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    margin-bottom: var(--space-3);
    color: var(--color-fg);
}
.cy-controls wa-button {
    color: var(--color-fg);
}
#cy {
    flex: 1 1 0;
    min-height: 0;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    overflow: hidden;
    width: 100%;
}
</style>

<div class="cy-wrapper">
    <div class="cy-controls">
        <h1 style="font-size:1.4rem;font-weight:600;letter-spacing:-.01em;margin:0;">Schema</h1>
        <div style="display:flex;align-items:center;gap:var(--space-2);">
            <span id="cy-zoom-level" style="font-family:var(--wa-font-family-code);font-size:0.75rem;color:var(--color-muted);min-width:4ch;text-align:right;">100%</span>
            <wa-button appearance="plain" size="small" id="cy-zoom-in" title="Zoom in"><wa-icon name="plus"></wa-icon></wa-button>
            <wa-button appearance="plain" size="small" id="cy-zoom-out" title="Zoom out"><wa-icon name="minus"></wa-icon></wa-button>
            <wa-button appearance="plain" size="small" id="cy-fit" title="Fit to screen"><wa-icon name="expand"></wa-icon></wa-button>
            <wa-button appearance="plain" size="small" id="cy-reset" title="Reset zoom"><wa-icon name="rotate-left"></wa-icon></wa-button>
        </div>
    </div>

    <div id="cy"></div>
</div>

<div id="cy-info-panel" style="display:none;position:fixed;bottom:var(--space-4);left:calc(var(--space-4) + 240px);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:var(--space-3) var(--space-4);min-width:200px;max-width:300px;box-shadow:var(--shadow-sm);z-index:100;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2);">
        <strong id="cy-info-title" style="font-size:0.9rem;"></strong>
        <wa-button appearance="plain" size="small" id="cy-info-close" style="color:var(--color-fg);"><wa-icon name="x"></wa-icon></wa-button>
    </div>
    <ul id="cy-info-columns" style="margin:0;padding:0;list-style:none;font-family:var(--wa-font-family-code);font-size:0.78rem;display:flex;flex-direction:column;gap:2px;"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<script>
(function () {
    var graphData = {{ graph | tojson }};

    var style = getComputedStyle(document.documentElement);
    function tok(name) { return style.getPropertyValue(name).trim(); }

    cytoscape.use(cytoscapeDagre);

    var cy = cytoscape({
        container: document.getElementById('cy'),
        elements: graphData,
        layout: {
            name: 'dagre',
            rankDir: 'LR',
            nodeSep: 60,
            rankSep: 120,
            padding: 40,
        },
        style: [
            {
                selector: 'node',
                style: {
                    'shape': 'rectangle',
                    'label': 'data(label)',
                    'background-color': tok('--color-surface') || '#f0f0ee',
                    'border-width': 1,
                    'border-color': tok('--color-border') || '#d4d4d2',
                    'color': tok('--color-fg') || '#1a1a1a',
                    'text-valign': 'center',
                    'text-halign': 'center',
                    'font-size': '13px',
                    'font-weight': '600',
                    'padding': '12px',
                    'min-width': '120px',
                },
            },
            {
                selector: 'node:selected',
                style: {
                    'border-color': tok('--color-accent') || '#b84a14',
                    'border-width': 2,
                },
            },
            {
                selector: 'edge',
                style: {
                    'label': 'data(label)',
                    'curve-style': 'bezier',
                    'target-arrow-shape': 'triangle',
                    'arrow-scale': 0.8,
                    'font-size': '10px',
                    'color': tok('--color-muted') || '#636363',
                    'line-color': tok('--color-border') || '#d4d4d2',
                    'target-arrow-color': tok('--color-border') || '#d4d4d2',
                    'text-background-color': tok('--color-bg') || '#f8f8f7',
                    'text-background-opacity': 1,
                    'text-background-padding': '2px',
                },
            },
        ],
    });

    cy.fit(undefined, 40);

    var zoomLevel = document.getElementById('cy-zoom-level');
    function updateZoom() {
        zoomLevel.textContent = Math.round(cy.zoom() * 100) + '%';
    }
    cy.on('zoom', updateZoom);
    updateZoom();

    document.getElementById('cy-zoom-in').addEventListener('click', function () {
        cy.zoom({ level: cy.zoom() * 1.2, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
    });
    document.getElementById('cy-zoom-out').addEventListener('click', function () {
        cy.zoom({ level: cy.zoom() / 1.2, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
    });
    document.getElementById('cy-fit').addEventListener('click', function () { cy.fit(undefined, 40); });
    document.getElementById('cy-reset').addEventListener('click', function () { cy.reset(); });

    var infoPanel = document.getElementById('cy-info-panel');
    var infoTitle = document.getElementById('cy-info-title');
    var infoCols  = document.getElementById('cy-info-columns');

    function closePanel() { infoPanel.style.display = 'none'; cy.nodes().unselect(); }

    cy.on('tap', 'node', function (e) {
        var node = e.target;
        var data = node.data();
        infoTitle.textContent = data.label;
        infoCols.innerHTML = '';
        (data.columns || []).forEach(function (col) {
            var li = document.createElement('li');
            li.style.cssText = 'display:flex;justify-content:space-between;gap:8px;padding:1px 0;';
            li.innerHTML = '<span>' + col.name + '</span><span style="color:var(--color-muted)">' + col.type + '</span>';
            infoCols.appendChild(li);
        });
        infoPanel.style.display = 'block';
    });

    cy.on('tap', function (e) { if (e.target === cy) closePanel(); });
    document.getElementById('cy-info-close').addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });
})();
</script>
{% endblock %}
