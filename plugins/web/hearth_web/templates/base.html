<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}{{ brand.name }}{% endblock %}</title>
        <link
            rel="stylesheet"
            href="https://ka-f.webawesome.com/webawesome@3.8.0/styles/webawesome.css"
        />
        <link rel="stylesheet" href="/static/hearth-theme.css" />
        <link rel="stylesheet" href="/static/base.css" />
        <script
            type="module"
            src="https://ka-f.webawesome.com/webawesome@3.8.0/webawesome.loader.js"
        ></script>
        <style>
            /* Scoped FOUC guard — do NOT blanket-hide all :not(:defined) (would blank wa-page). */
            wa-page:not(:defined),
            wa-dialog:not(:defined),
            wa-drawer:not(:defined) {
                visibility: hidden;
            }
        </style>
        {% if brand.primary_color %}
        <style>
            :root {
                --color-accent: {{ brand.primary_color }};
            }
        </style>
        {% endif %}
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("theme");
                    var dark = t === "dark";
                    document.documentElement.dataset.theme = dark
                        ? "dark"
                        : "light";
                    document.documentElement.classList.toggle("wa-dark", dark);
                    document.documentElement.classList.toggle(
                        "wa-light",
                        !dark,
                    );
                    document.documentElement.dataset.density =
                        localStorage.getItem("density") || "balanced";
                    document.documentElement.dataset.sidebarTone =
                        localStorage.getItem("sidebar-tone") || "match";
                    document.documentElement.dataset.radius =
                        localStorage.getItem("radius") || "rounded";
                } catch (e) {
                    /* localStorage unavailable — CSS attribute selectors simply won't
                       match; defaults (no data-* set) fall through to base styles. */
                }
            })();
        </script>
    </head>

    <body>
        {% block body %}
        <main class="content">{% block content %}{% endblock %}</main>
        {% endblock %}
        <script src="/static/theme-toggle.js"></script>
        <script src="/static/prefs.js"></script>
        <script src="/static/vendor/htmx.min.js" defer></script>
        <script src="/static/vendor/alpine.min.js" defer></script>
    </body>
</html>
