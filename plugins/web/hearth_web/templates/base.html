<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}{{ brand.name }}{% endblock %}</title>
        <link rel="stylesheet" href="/static/base.css" />
        {% if brand.primary_color %}
        <style>
            :root {
                --color-accent: {{ brand.primary_color }};
            }
        </style>
        {% endif %}
        <script>
            (function () {
                var t = localStorage.getItem("theme");
                if (t) document.documentElement.dataset.theme = t;
            })();
        </script>
    </head>

    <body>
        {% block body %}
        <main class="content">{% block content %}{% endblock %}</main>
        {% endblock %}
        <script src="/static/theme-toggle.js"></script>
        <script src="/static/vendor/htmx.min.js" defer></script>
        <script src="/static/vendor/alpine.min.js" defer></script>
        <script>
            // Sidebar collapse/expand functionality
            (function () {
                var sidebar = document.getElementById('sidebar');
                var toggle = document.getElementById('sidebar-toggle');
                if (!sidebar || !toggle) return;

                // Initialize from localStorage
                var collapsed = localStorage.getItem('sidebar-collapsed') === 'true';
                if (collapsed) {
                    sidebar.classList.add('collapsed');
                    toggle.setAttribute('aria-label', 'Expand sidebar');
                    toggle.setAttribute('title', 'Expand sidebar');
                    toggle.textContent = '▶';
                }

                toggle.addEventListener('click', function () {
                    var isCollapsed = sidebar.classList.toggle('collapsed');
                    localStorage.setItem('sidebar-collapsed', isCollapsed);
                    toggle.setAttribute('aria-label', isCollapsed ? 'Expand sidebar' : 'Collapse sidebar');
                    toggle.setAttribute('title', isCollapsed ? 'Expand sidebar' : 'Collapse sidebar');
                    toggle.textContent = isCollapsed ? '▶' : '◀';
                });
            })();
        </script>
    </body>
</html>
