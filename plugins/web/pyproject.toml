[project]
name = "hearth-web"
version = "0.0.1"
description = "Hearth plugin: web framework + admin console"
requires-python = ">=3.13"
dependencies = [
    "hearth",
    "hearth-auth",
    "hearth-commons",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "fastapi-csrf-protect>=1.0",
]

[project.entry-points."hearth.cli"]
web = "hearth_web.cli:web_app"

[tool.uv.sources]
hearth = { workspace = true }
hearth-auth = { workspace = true }
hearth-commons = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hearth_web"]